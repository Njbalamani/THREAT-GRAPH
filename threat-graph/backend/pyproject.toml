[project]
name = "threatgraph-backend"
version = "1.0.0"
description = "ThreatGraph API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["B008", "N806", "UP038"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
